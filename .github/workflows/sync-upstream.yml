name: Sync upstream

# Traz o que o anomalyco/opencode publicou para o fork Naoriky-VFX/opencode.
# Usa merge (não reset, não force push): se houver conflito, o job falha e avisa
# em vez de sobrescrever qualquer coisa.

on:
  schedule:
    # 06:00 UTC = 03:00 em Brasília (todo dia)
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do fork
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar autor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Buscar upstream
        run: |
          git remote add upstream https://github.com/anomalyco/opencode.git || true
          git fetch upstream dev

      - name: Ver diferença
        id: diff
        run: |
          NOVOS=$(git rev-list --count HEAD..upstream/dev)
          echo "novos=$NOVOS" >> "$GITHUB_OUTPUT"
          echo "commits novos no upstream: $NOVOS"

      - name: Nada a fazer
        if: steps.diff.outputs.novos == '0'
        run: echo "Fork já está atualizado."

      - name: Merge e push
        if: steps.diff.outputs.novos != '0'
        run: |
          git log --oneline HEAD..upstream/dev | head -20
          if ! git merge --no-edit upstream/dev; then
            echo "::error::Conflito ao mesclar upstream/dev. Nada foi enviado."
            git merge --abort || true
            exit 1
          fi
          git push origin dev
