name: Sync upstream

# Traz o que o anomalyco/opencode publicou para o fork Naoriky-VFX/opencode.
# Só avança em fast-forward: se o fork tiver commit próprio, o job falha e avisa
# em vez de sobrescrever qualquer coisa.

on:
  schedule:
    # 06:00 UTC = 03:00 em Brasília (todo dia)
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do fork
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar autor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Buscar upstream
        run: |
          git remote add upstream https://github.com/anomalyco/opencode.git || true
          git fetch upstream dev

      - name: Quantos commits de diferença
        id: diff
        run: |
          NOVOS=$(git rev-list --count HEAD..upstream/dev)
          PROPRIOS=$(git rev-list --count upstream/dev..HEAD)
          echo "novos=$NOVOS" >> "$GITHUB_OUTPUT"
          echo "proprios=$PROPRIOS" >> "$GITHUB_OUTPUT"
          echo "upstream: $NOVOS | fork: $PROPRIOS"

      - name: Parar se o fork tem commit próprio
        if: steps.diff.outputs.proprios != '0'
        run: |
          echo "::error::O fork tem ${{ steps.diff.outputs.proprios }} commit(s) que o upstream não tem. Nada foi alterado."
          git log --oneline upstream/dev..HEAD | head -20
          exit 1

      - name: Nada a fazer
        if: steps.diff.outputs.novos == '0'
        run: echo "Fork já está atualizado."

      - name: Fast-forward e push
        if: steps.diff.outputs.novos != '0' && steps.diff.outputs.proprios == '0'
        run: |
          git log --oneline HEAD..upstream/dev | head -20
          git merge --ff-only upstream/dev
          git push origin dev
